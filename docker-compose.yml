# Local development: `npm run services:up` starts Postgres and Redis.
# Full stack in containers: `docker compose --profile app up --build`.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: codefighter
      POSTGRES_PASSWORD: codefighter
      POSTGRES_DB: codefighter
    ports:
      - "5433:5432"  # 5433 on the host so it never clashes with a locally installed Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codefighter"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --loglevel warning
    ports:
      - "6380:6379"  # 6380 on the host so it never clashes with a local or WSL Redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://codefighter:codefighter@postgres:5432/codefighter
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-}  # the app refuses to start without a 32+ char secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
